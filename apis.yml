name: Impactyn B.V
description: >-
  Impactyn B.V is an AI-powered crowd-marketing platform that turns authentic
  user-generated video reviews into brand marketing assets. Based in Cairo,
  Egypt, Impactyn connects brands with real customers who record genuine video
  testimonials, letting businesses leverage user-generated video content to
  increase visibility, credibility, and engagement. The platform is delivered
  primarily through consumer iOS and Android mobile apps plus a partner/brand
  web console, and was surfaced as a portfolio company of 500 Global. Founded by
  Mohamed Wahid and registered in Egypt under Commercial Register No. 18682, the
  company reports 51,000 consumer signups in its first year and sells brands a
  campaign-based service with a live views/engagement/ROI dashboard. No public
  API, developer portal, SDK, machine-readable specification or /.well-known/
  document is published — verified by probe on 2026-08-12 — and the partner
  console host advertised on the website no longer resolves. This profile
  captures company identity, the domain-security posture, a verified well-known
  probe, and the absence of published pricing.
